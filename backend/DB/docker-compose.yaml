version: "3.9"
services:
  # Instancia principal de Weaviate como base de datos vectorial
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate
    # Reinicia automaticamente salvo que se detenga de forma manual
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Limite por defecto de resultados en consultas
      QUERY_DEFAULTS_LIMIT: 25
      # Permite acceso sin autenticacion para desarrollo local
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      # Ruta donde Weaviate guarda los datos en disco
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      # Modulo vectorizador que se usa por defecto al crear clases
      DEFAULT_VECTORIZER_MODULE: "text2vec-transformers"
      # Lista de modulos activos en esta instancia
      ENABLE_MODULES: "text2vec-transformers"
      # URL del servicio de inferencia donde se ejecuta el modelo de embeddings
      TRANSFORMERS_INFERENCE_API: "http://t2v-transformers:8080"
    volumes:
      # Volumen persistente para que los datos sobrevivan reinicios del contenedor
      - weaviate_data:/var/lib/weaviate

  # Servicio de inferencia que corre el modelo snowflake arctic-embed-l-v2.0
  # Genera los vectores de 1024 dimensiones con ventana de 8192 tokens
  # Se usa sin GPU ya que ENABLE_CUDA esta en 0
  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:Snowflake-snowflake-arctic-embed-l-v2.0
    environment:
      # Desactiva el uso de GPU y corre la inferencia solo en CPU
      ENABLE_CUDA: "0"

volumes:
  # Declara el volumen compartido para persistencia de datos de Weaviate
  weaviate_data: